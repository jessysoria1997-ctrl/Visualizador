    var ctx = crearContexto(esc);
    var S = ctx.S;
    var P = calcularPorcentajes(esc);
    var nombres = P.listas.map(function (l) { return l.nombre; });

    // Cocientes de las listas que participan: divisores 1..S+1 (el S+1 permite
    // saber quién quedaría primero fuera aunque una sola lista se lo lleve todo).
    var todos = [];
    P.listas.forEach(function (l) {
      if (!l.elegible) return;
      for (var k = 1; k <= S + 1; k++) {
        var dv = ctx.divisores[k];
        todos.push({ listaId: l.id, idx: l.idx, votos: l.votos, k: k, divisor: dv, cociente: valorCociente(l.votos, dv) });
      }
    });
    var orden = ordenarCocientes(todos, ctx.desempate);

    var escanos = P.listas.map(function () { return 0; });
    var adjudicacion = [];
    for (var n = 0; n < S; n++) {
      var g = orden[n];
      escanos[g.idx]++;
      // Segundo: el mejor cociente vigente de OTRA lista en ese momento.
      var seg = null;
      for (var j = n + 1; j < orden.length; j++) if (orden[j].idx !== g.idx) { seg = orden[j]; break; }
      adjudicacion.push({
        numero: n + 1,
        listaId: g.listaId,
        idx: g.idx,
        nombre: nombres[g.idx],
        votos: g.votos,
        k: g.k,
        divisor: g.divisor,
        cociente: g.cociente,
        segundo: seg ? resumenCociente(seg, nombres) : null,
        diferencia: seg ? g.cociente - seg.cociente : null,
        empatado: false
      });
    }

    // Empates: grupos de cocientes exactamente iguales que tocan algún escaño.
    var empates = [];
    var i = 0;
    while (i < S) {
      var f = i + 1;
      while (f < orden.length && cmpCocientes(orden[i].votos, orden[i].divisor, orden[f].votos, orden[f].divisor) === 0) f++;
      if (f - i >= 2) {
        var grupo = orden.slice(i, f);
        var porTabla = ctx.desempate === 'orden_tabla';
        if (!porTabla) {
          for (var a = 0; a < grupo.length && !porTabla; a++) {
            for (var b = a + 1; b < grupo.length; b++) if (grupo[a].votos === grupo[b].votos) { porTabla = true; break; }
          }
        }
        var inicio = i;
        empates.push({
          cociente: grupo[0].cociente,
          decisivo: f > S,
          plazas: Math.min(f, S) - i,
          regla: ctx.desempate,
          porOrdenDeTabla: porTabla,
          miembros: grupo.map(function (c, p) {
            return { listaId: c.listaId, idx: c.idx, nombre: nombres[c.idx], votos: c.votos, k: c.k, divisor: c.divisor,
                     posicion: inicio + p + 1, gana: inicio + p < S };
          })
        });
        for (var q = i; q < Math.min(f, S); q++) adjudicacion[q].empatado = true;
      }
      i = f;
    }

    var secuencial = repartoRapido(ctx, P.listas.map(function (l) { return l.votos; }));
    var asignados = 0, coincide = true;
    escanos.forEach(function (e, idx) { asignados += e; if (e !== secuencial[idx]) coincide = false; });

    var listas = P.listas.map(function (l) {
      var s = escanos[l.idx];
      var dv = ctx.divisores[Math.min(s + 1, S + 1)];
      return {
        id: l.id, nombre: l.nombre, idx: l.idx, votos: l.votos, pct: l.pct,
        elegible: l.elegible, motivoExclusion: l.motivoExclusion,
        escanos: s,
        pctEscanos: s * 100 / S,
        siguiente: { k: s + 1, divisor: dv, cociente: valorCociente(l.votos, dv) }
      };
    });

    var ultimo = adjudicacion[S - 1];
    var excl = orden.length > S ? orden[S] : null;

    return {
      ok: true,
      errores: val.errores,
      avisos: val.avisos,
      metodo: { id: ctx.metodo.id, nombre: ctx.metodo.nombre, nombreLargo: ctx.metodo.nombreLargo, serie: ctx.metodo.serie },
      escanos: S,
      desempate: ctx.desempate,
      totales: {
        votosListas: P.votosListas, blancos: P.blancos, nulos: P.nulos, emitidos: P.emitidos,
        base: P.base, baseModo: P.baseModo, umbral: P.umbral, votosElegibles: P.votosElegibles,
        pctBlancos: P.pctBlancos, pctNulos: P.pctNulos,
        listas: P.listas.length,
        listasElegibles: P.listas.filter(function (l) { return l.elegible; }).length
      },
      listas: listas,
      adjudicacion: adjudicacion,
      orden: orden.slice(0, S + EXTRA_ORDEN).map(function (c, p) {
        return { posicion: p + 1, gana: p < S, listaId: c.listaId, idx: c.idx, nombre: nombres[c.idx], votos: c.votos, k: c.k, divisor: c.divisor, cociente: c.cociente };
      }),
      corte: {
        ultimoGanador: { numero: ultimo.numero, listaId: ultimo.listaId, idx: ultimo.idx, nombre: ultimo.nombre, votos: ultimo.votos, k: ultimo.k, divisor: ultimo.divisor, cociente: ultimo.cociente },
        primerExcluido: excl ? resumenCociente(excl, nombres) : null,
        diferencia: excl ? ultimo.cociente - excl.cociente : null
      },
      empates: empates,
      hayEmpateDecisivo: empates.some(function (e) { return e.decisivo; }),
      verificacion: {
        disponibles: S,
        asignados: asignados,
        coincide: asignados === S,
        coincideSecuencial: coincide,
        ok: asignados === S && coincide
      }
    };
  }

  /* --------------------------------------------------------------------------
   * 5. SIGUIENTE ESCAÑO
   * ------------------------------------------------------------------------ */

  /**
   * Sin listaId: quién se llevaría el escaño S+1 (el primer cociente que quedó fuera).
   * Con listaId: cuál es el próximo escaño de esa lista, con qué cociente compite
   * y qué cociente rival tiene que superar (el ganador más débil de otra lista).
   */
  function siguienteEscano(esc, listaId, resultado) {
    var res = resultado || asignarEscanos(esc);
    if (!res.ok) return null;
    if (listaId == null) {
      var ex = res.corte.primerExcluido;
      if (!ex) return null;
      return { tipo: 'global', numero: res.escanos + 1, listaId: ex.listaId, idx: ex.idx, nombre: ex.nombre, votos: ex.votos,
               k: ex.k, divisor: ex.divisor, cociente: ex.cociente, diferenciaConUltimo: res.corte.diferencia };
    }
    var l = null;
    res.listas.forEach(function (x) { if (x.id === listaId) l = x; });
    if (!l) return null;
    var base = { tipo: 'lista', listaId: l.id, idx: l.idx, nombre: l.nombre, votos: l.votos, escanosActuales: l.escanos, elegible: l.elegible };
    if (l.escanos >= res.escanos) { base.completo = true; return base; }
    var rival = null;
    for (var n = res.adjudicacion.length - 1; n >= 0; n--) {
      if (res.adjudicacion[n].listaId !== listaId) { rival = res.adjudicacion[n]; break; }
    }
    base.completo = false;
    base.numero = l.escanos + 1;
    base.divisor = l.siguiente.divisor;
    base.cocienteActual = l.siguiente.cociente;
    base.rival = rival ? { numeroEscano: rival.numero, listaId: rival.listaId, idx: rival.idx, nombre: rival.nombre, votos: rival.votos,
                           k: rival.k, divisor: rival.divisor, cociente: rival.cociente } : null;
    base.brecha = rival ? rival.cociente - l.siguiente.cociente : null;
    return base;
  }

  /* --------------------------------------------------------------------------
   * BÚSQUEDAS EXACTAS (internas)
   * Los escaños de una lista nunca bajan cuando suben sus votos (con las demás
   * fijas), así que el mínimo entero se encuentra por búsqueda binaria sobre el
   * reparto real. No se usa ninguna fórmula aproximada.
   * ------------------------------------------------------------------------ */

  /** Menor entero x en [lo, hi] con pred(x) verdadero (pred pasa de falso a verdadero una sola vez). */
  function primerVerdadero(lo, hi, pred) {
    while (lo < hi) {
      var mid = lo + Math.floor((hi - lo) / 2);
      if (pred(mid)) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  function prepararBusqueda(esc) {
    var indice = {};
    esc.listas.forEach(function (l, i) { indice[l.id] = i; });
    return { ctx: crearContexto(esc), votos: esc.listas.map(function (l) { return l.votos; }), indice: indice };
  }

  /** Escaños de la lista `idx` si tuviera V votos y las demás no cambiaran (reparto completo). */
  function escanosConGenerico(busq, idx, V) {
    var previo = busq.votos[idx];
    busq.votos[idx] = V;
    var r = repartoRapido(busq.ctx, busq.votos)[idx];
    busq.votos[idx] = previo;
    return r;
  }

  /**
   * Evaluador rápido y exacto de "escaños de la lista idx con V votos".
   * Como solo cambian los votos de una lista, los cocientes de las demás no se
   * mueven: se ordenan una vez (los S mejores, N[0] >= N[1] >= …) y después basta
   * con ubicar los cocientes propios entre ellos. El k-ésimo cociente propio gana
   * escaño si como mucho S-k cocientes rivales van por delante, es decir, si
   * precede a N[S-k]. Con umbral, el conjunto de rivales depende de la base de
   * votos y se guarda uno por cada combinación de listas que lo alcanzan.
   */
  function evaluadorDe(busq, idx) {
    if (!busq.evaluadores) busq.evaluadores = {};
    if (busq.evaluadores[idx]) return busq.evaluadores[idx];
    var ctx = busq.ctx, S = ctx.S, divs = ctx.divisores, regla = ctx.desempate, votos = busq.votos, L = votos.length;
    var resto = ctx.extraBase, i;
    for (i = 0; i < L; i++) if (i !== idx) resto += votos[i];
    var memo = {};

    function rivalesOrdenados(base) {
      var el = [], clave = '';
      for (var a = 0; a < L; a++) {
        if (a === idx) continue;
        if (votos[a] > 0 && superaUmbral(votos[a], base, ctx.tMill)) { el.push(a); clave += a + ','; }
      }
      var N = memo[clave];
      if (N) return N;
      N = [];
      if (el.length) {
        var cuenta = new Array(L);
        for (var z = 0; z < L; z++) cuenta[z] = 0;
        for (var n = 0; n < S; n++) {
          var mejor = el[0];
          for (var j = 1; j < el.length; j++) {
            var c = el[j];
            var cmp = cmpCocientes(votos[c], divs[cuenta[c] + 1], votos[mejor], divs[cuenta[mejor] + 1]);
            if (cmp > 0 || (cmp === 0 && prefiere(regla, votos[c], c, votos[mejor], mejor))) mejor = c;
          }
          N.push({ v: votos[mejor], div: divs[cuenta[mejor] + 1], idx: mejor });
          cuenta[mejor]++;
        }
      }
      memo[clave] = N;
      return N;
    }
    var fijos = ctx.tMill === 0 ? rivalesOrdenados(resto + 1) : null; // sin umbral, los rivales no dependen de V

    function evaluar(V) {
      if (V <= 0) return 0;
      var base = resto + V;
      if (!superaUmbral(V, base, ctx.tMill)) return 0;
      var N = fijos || rivalesOrdenados(base);
      if (N.length === 0) return S;
      var lo = 0, hi = S; // mayor k cuyo cociente propio precede a N[S-k]
      while (lo < hi) {
        var k = lo + Math.ceil((hi - lo) / 2);
        var r = N[S - k];
        var cmp = cmpCocientes(V, divs[k], r.v, r.div);
        if (cmp > 0 || (cmp === 0 && prefiere(regla, V, idx, r.v, r.idx))) lo = k; else hi = k - 1;
      }
      return lo;
    }
    busq.evaluadores[idx] = evaluar;
    return evaluar;
  }

  /** Escaños de la lista `idx` si tuviera V votos y las demás no cambiaran. */
  function escanosCon(busq, idx, V) { return evaluadorDe(busq, idx)(V); }

  /** Menor número de votos con el que la lista `idx` obtiene al menos k escaños (demás fijas). null si es inalcanzable. */
  function umbralDeVotos(busq, idx, k) {
    if (k <= 0) return 0;
    if (k > busq.ctx.S) return null;
    var v = busq.votos[idx];
    function pred(V) { return escanosCon(busq, idx, V) >= k; }
    if (pred(v)) return primerVerdadero(0, v, pred);
    var lo = v, paso = 1;
    for (;;) {
      var hi = v + paso;
      if (hi > LIMITE_BUSQUEDA) return null;
      if (pred(hi)) return primerVerdadero(lo + 1, hi, pred);
      lo = hi;
      paso *= 2;
    }
  }

  function conVotos(esc, listaId, votos) {
    var copia = {};
    for (var k in esc) copia[k] = esc[k];
    copia.listas = esc.listas.map(function (l) { return l.id === listaId ? { id: l.id, nombre: l.nombre, votos: votos } : l; });
    return copia;
  }

  /** Diferencias de escaños entre dos repartos (arreglos por índice de lista). */
  function cambiosDeEscanos(esc, antes, despues) {
    var out = [];
    esc.listas.forEach(function (l, i) {
      if (antes[i] !== despues[i]) out.push({ listaId: l.id, idx: i, nombre: l.nombre, de: antes[i], a: despues[i], delta: despues[i] - antes[i] });
    });
    return out;
  }

  function clasificarViabilidad(votosAdicionales, baseVotos) {
    var puntos = baseVotos > 0 ? votosAdicionales / baseVotos * 100 : Infinity;
    var nivel = 3;
    if (puntos <= CORTES_VIABILIDAD[0]) nivel = 0;
    else if (puntos <= CORTES_VIABILIDAD[1]) nivel = 1;
    else if (puntos <= CORTES_VIABILIDAD[2]) nivel = 2;
    var n = NIVELES_VIABILIDAD[nivel];
    return { clave: n.clave, etiqueta: n.etiqueta, nivel: n.nivel, puntos: puntos };
  }

  /** ¿Participa el k-ésimo cociente de la lista en un empate decisivo de `res`? Devuelve el empate o null. */
  function empateDecisivoDe(res, listaId, k) {
    if (!res || !res.ok) return null;
    for (var i = 0; i < res.empates.length; i++) {
      var e = res.empates[i];
      if (!e.decisivo) continue;
      for (var j = 0; j < e.miembros.length; j++) {
        if (e.miembros[j].listaId === listaId && e.miembros[j].k === k) return { empate: e, gana: e.miembros[j].gana };
      }
    }
    return null;
  }

  /* --------------------------------------------------------------------------
   * 6. VOTOS ADICIONALES NECESARIOS
   * ------------------------------------------------------------------------ */

  /**
   * Mínimo número entero de votos adicionales con el que la lista consigue
   * `objetivo` escaños (por defecto, uno más que ahora), manteniendo fijos los
   * votos de las demás listas. Se obtiene por búsqueda sobre el reparto real.
   */
  function votosAdicionalesNecesarios(esc, listaId, opciones) {
    var op = opciones || {};
    var res = op.resultado || asignarEscanos(esc);
    if (!res.ok) return { posible: false, motivo: 'escenario_invalido' };
    var l = null;
    res.listas.forEach(function (x) { if (x.id === listaId) l = x; });
    if (!l) return { posible: false, motivo: 'lista_desconocida' };

    var S = res.escanos;
    var objetivo = op.objetivo == null ? l.escanos + 1 : op.objetivo;
    var comun = { listaId: l.id, idx: l.idx, nombre: l.nombre, votosActuales: l.votos, escanosActuales: l.escanos, objetivo: objetivo };
    if (objetivo > S) { comun.posible = false; comun.motivo = 'sin_mas_escanos'; return comun; }

    var busq = prepararBusqueda(esc);
    var minimo = umbralDeVotos(busq, l.idx, objetivo);
    if (minimo == null) { comun.posible = false; comun.motivo = 'fuera_de_rango'; return comun; }

    var adicionales = Math.max(0, minimo - l.votos);
    var antes = res.listas.map(function (x) { return x.escanos; });
    var escDespues = conVotos(esc, listaId, minimo);
    var resDespues = asignarEscanos(escDespues);
    var despues = resDespues.listas.map(function (x) { return x.escanos; });

    // Señalización de empates: ¿gana gracias al desempate?, ¿había un empate perdido justo antes?
    var empate = null;
    var eDesp = empateDecisivoDe(resDespues, listaId, objetivo);
    if (eDesp && eDesp.gana) empate = { tipo: 'gana_por_desempate', con: eDesp.empate };
    if (!empate && minimo - 1 >= 0 && adicionales >= 1) {
      var ePrev = empateDecisivoDe(asignarEscanos(conVotos(esc, listaId, minimo - 1)), listaId, objetivo);
      if (ePrev && !ePrev.gana) empate = { tipo: 'empate_previo_perdido', con: ePrev.empate, votos: minimo - 1, adicionales: adicionales - 1 };
    }

    comun.posible = true;
    comun.adicionales = adicionales;
    comun.nuevosVotos = minimo;
    comun.escanosDespues = despues[l.idx];
    comun.cambios = cambiosDeEscanos(esc, antes, despues);
    comun.crecimientoPct = l.votos > 0 ? adicionales / l.votos * 100 : null;
    comun.viabilidad = clasificarViabilidad(adicionales, res.totales.base);
    comun.bajoUmbral = !l.elegible && l.votos > 0;
    comun.empate = empate;
    comun.siguiente = siguienteEscano(esc, listaId, res);
    return comun;
  }

  /* --------------------------------------------------------------------------
   * 7. PÉRDIDA DE ESCAÑOS
   * ------------------------------------------------------------------------ */

  /**
   * Cuántos votos puede perder la lista antes de quedarse con menos de k escaños
   * (por defecto k = los que tiene ahora, es decir, su último escaño).
   *   colchon   = votos que puede perder conservando el escaño k
   *   pierdeCon = colchon + 1 = mínimo de votos perdidos con el que lo pierde
   */
  function votosParaPerderEscano(esc, listaId, k, opciones) {
    var op = opciones || {};
    var res = op.resultado || asignarEscanos(esc);
    if (!res.ok) return { posible: false, motivo: 'escenario_invalido' };
    var l = null;
    res.listas.forEach(function (x) { if (x.id === listaId) l = x; });
    if (!l) return { posible: false, motivo: 'lista_desconocida' };
    var objetivo = k == null ? l.escanos : k;
    var comun = { listaId: l.id, idx: l.idx, nombre: l.nombre, votosActuales: l.votos, escanosActuales: l.escanos, k: objetivo };
    if (l.escanos === 0 || objetivo < 1 || objetivo > l.escanos) { comun.posible = false; comun.motivo = 'sin_escano'; return comun; }
    var hayRival = esc.listas.some(function (x) { return x.id !== listaId && x.votos > 0; });
    if (!hayRival) { comun.posible = false; comun.motivo = 'sin_rivales'; return comun; }

    var busq = prepararBusqueda(esc);
    var minimo = umbralDeVotos(busq, l.idx, objetivo); // siempre <= votos actuales
    var colchon = l.votos - minimo;
    var antes = res.listas.map(function (x) { return x.escanos; });
    var resDespues = asignarEscanos(conVotos(esc, listaId, minimo - 1));
    var despues = resDespues.ok ? resDespues.listas.map(function (x) { return x.escanos; }) : antes.map(function (e, i) { return i === l.idx ? 0 : e; });

    // Empate: con exactamente `colchon` votos menos, ¿conserva el escaño solo por el desempate?
    var empate = null;
    var eLim = empateDecisivoDe(colchon === 0 ? res : asignarEscanos(conVotos(esc, listaId, minimo)), listaId, objetivo);
    if (eLim && eLim.gana) empate = { tipo: 'conserva_por_desempate', con: eLim.empate };
    var eDesp = empateDecisivoDe(resDespues, listaId, objetivo);
    if (eDesp && !eDesp.gana) empate = { tipo: 'pierde_por_desempate', con: eDesp.empate };

    comun.posible = true;
    comun.votosMinimos = minimo;
    comun.colchon = colchon;
    comun.pierdeCon = colchon + 1;
    comun.nuevosVotos = minimo - 1;
    comun.escanosDespues = despues[l.idx];
    comun.cambios = cambiosDeEscanos(esc, antes, despues);
    comun.caidaPct = l.votos > 0 ? (colchon + 1) / l.votos * 100 : null;
    comun.puntos = res.totales.base > 0 ? (colchon + 1) / res.totales.base * 100 : null;
    comun.empate = empate;
    comun.sinReparto = !resDespues.ok; // con esos votos ya nadie alcanzaría el umbral
    return comun;
  }

  /* --------------------------------------------------------------------------
   * MÁRGENES DE TODAS LAS LISTAS (ranking de competitividad y puntos de quiebre)
   * ------------------------------------------------------------------------ */

  /**
   * Para cada lista: votos que le faltan para su siguiente escaño y votos que
   * puede perder antes de ceder el último. Incluye el ranking ordenado.
   */
  function analizarMargenes(esc, resultado) {
    var res = resultado || asignarEscanos(esc);
    if (!res.ok) return null;
    var S = res.escanos;
    var busq = prepararBusqueda(esc);
    var antes = res.listas.map(function (x) { return x.escanos; });
    var hayVariosConVotos = esc.listas.filter(function (x) { return x.votos > 0; }).length > 1;

    function repartoCon(idx, V) {
      var previo = busq.votos[idx];
      busq.votos[idx] = V;
      var r = repartoRapido(busq.ctx, busq.votos);
      busq.votos[idx] = previo;
      return r;
    }

    var filas = res.listas.map(function (l) {
      var fila = { listaId: l.id, idx: l.idx, nombre: l.nombre, votos: l.votos, escanos: l.escanos, elegible: l.elegible,
                   motivoExclusion: l.motivoExclusion, proximo: null, perdida: null, siguiente: siguienteEscano(esc, l.id, res) };
      if (l.escanos < S) {
        var up = umbralDeVotos(busq, l.idx, l.escanos + 1);
        if (up != null) {
          var adic = up - l.votos;
          var desp = repartoCon(l.idx, up);
          fila.proximo = {
            numero: l.escanos + 1,
            adicionales: adic,
            nuevosVotos: up,
            escanosDespues: desp[l.idx],
            cambios: cambiosDeEscanos(esc, antes, desp),
            crecimientoPct: l.votos > 0 ? adic / l.votos * 100 : null,
            viabilidad: clasificarViabilidad(adic, res.totales.base)
          };
        }
      }
      if (l.escanos >= 1 && hayVariosConVotos) {
        var down = umbralDeVotos(busq, l.idx, l.escanos);
        var colchon = l.votos - down;
        var desp2 = repartoCon(l.idx, down - 1);
        fila.perdida = {
          numero: l.escanos,
          votosMinimos: down,
          colchon: colchon,
          pierdeCon: colchon + 1,
          nuevosVotos: down - 1,
          escanosDespues: desp2[l.idx],
          cambios: cambiosDeEscanos(esc, antes, desp2),
          caidaPct: l.votos > 0 ? (colchon + 1) / l.votos * 100 : null,
          puntos: res.totales.base > 0 ? (colchon + 1) / res.totales.base * 100 : null
        };
      }
      return fila;
    });

    var ranking = filas.filter(function (f) { return f.proximo; })
      .sort(function (a, b) { return a.proximo.adicionales - b.proximo.adicionales || a.idx - b.idx; });
    var fragiles = filas.filter(function (f) { return f.perdida; })
      .sort(function (a, b) { return a.perdida.pierdeCon - b.perdida.pierdeCon || a.idx - b.idx; });

    return {
      filas: filas,
      ranking: ranking,
      masCercana: ranking.length ? ranking[0] : null,   // la que menos votos necesita para ganar un escaño
      masExpuesta: fragiles.length ? fragiles[0] : null // la que menos votos puede perder antes de ceder uno
    };
  }

  /**
   * Seguridad de cada escaño adjudicado: votos que su lista puede perder antes de
   * quedarse sin él. Permite señalar el escaño más competitivo y el más seguro.
   */
  function seguridadPorEscano(esc, resultado) {
    var res = resultado || asignarEscanos(esc);
    if (!res.ok) return null;
    var busq = prepararBusqueda(esc);
    var hayVariosConVotos = esc.listas.filter(function (x) { return x.votos > 0; }).length > 1;
    var porEscano = res.adjudicacion.map(function (a) {
      if (!hayVariosConVotos) return { numero: a.numero, listaId: a.listaId, idx: a.idx, nombre: a.nombre, k: a.k, colchon: null, pierdeCon: null };
      var minimo = umbralDeVotos(busq, a.idx, a.k);
      var colchon = a.votos - minimo;
      return { numero: a.numero, listaId: a.listaId, idx: a.idx, nombre: a.nombre, k: a.k, votosMinimos: minimo,
               colchon: colchon, pierdeCon: colchon + 1,
               puntos: res.totales.base > 0 ? (colchon + 1) / res.totales.base * 100 : null };
    });
    var conDato = porEscano.filter(function (p) { return p.pierdeCon != null; });
    var masCompetitivo = null, masSeguro = null;
    conDato.forEach(function (p) {
      if (!masCompetitivo || p.pierdeCon < masCompetitivo.pierdeCon) masCompetitivo = p;
      if (!masSeguro || p.pierdeCon > masSeguro.pierdeCon) masSeguro = p;
    });
    return { porEscano: porEscano, masCompetitivo: masCompetitivo, masSeguro: masSeguro };
  }

  /**
   * Trasvase: mínimo de votos que la lista `aId` tendría que quitarle a `deId`
   * para ganar un escaño más (el total de votos no cambia). null si no alcanza.
   */
  function trasvaseMinimo(esc, deId, aId, resultado) {
    var res = resultado || asignarEscanos(esc);
    if (!res.ok || deId === aId) return null;
    var busq = prepararBusqueda(esc);
    var iDe = busq.indice[deId], iA = busq.indice[aId];
    if (iDe == null || iA == null) return null;
    var objetivo = res.listas[iA].escanos + 1;
    if (objetivo > res.escanos) return null;
    var vDe = busq.votos[iDe], vA = busq.votos[iA];
    if (vDe < 1) return null;
    function reparto(x) {
      busq.votos[iDe] = vDe - x; busq.votos[iA] = vA + x;
      var r = repartoRapido(busq.ctx, busq.votos);
      busq.votos[iDe] = vDe; busq.votos[iA] = vA;
      return r;
    }
    function pred(x) { return reparto(x)[iA] >= objetivo; }
    if (!pred(vDe)) return null;
    var x = primerVerdadero(1, vDe, pred);
    var antes = res.listas.map(function (l) { return l.escanos; });
    var desp = reparto(x);
    return { deId: deId, aId: aId, votos: x, escanosDespues: desp[iA], cambios: cambiosDeEscanos(esc, antes, desp) };
  }

  /**
   * Menor número de votos con el que la lista obtiene al menos k escaños, con las
   * demás fijas (el "punto de quiebre" del escaño k). null si es inalcanzable.
   */
  function votosMinimosPara(esc, listaId, k) {
    if (!validarEscenario(esc).ok) return null;
    var busq = prepararBusqueda(esc);
    var idx = busq.indice[listaId];
    if (idx == null) return null;
    return umbralDeVotos(busq, idx, k);
  }

  /**
   * Votos adicionales con los que una lista que hoy está bajo el umbral lo alcanza
   * (con las demás fijas). Devuelve 0 si ya lo alcanza y null si no tiene sentido.
   */
  function votosParaAlcanzarUmbral(esc, listaId) {
    if (!validarEscenario(esc).ok) return null;
    var busq = prepararBusqueda(esc);
    var idx = busq.indice[listaId];
    if (idx == null) return null;
    var ctx = busq.ctx;
    var v = busq.votos[idx];
    var resto = ctx.extraBase;
    busq.votos.forEach(function (x, i) { if (i !== idx) resto += x; });
    function alcanza(V) { return V > 0 && superaUmbral(V, resto + V, ctx.tMill); }
    if (alcanza(v)) return 0;
    var lo = v, paso = 1;
    for (;;) {
      var hi = v + paso;
      if (hi > LIMITE_BUSQUEDA) return null;
      if (alcanza(hi)) return primerVerdadero(lo + 1, hi, alcanza) - v;
      lo = hi;
      paso *= 2;
    }
  }

  /* --------------------------------------------------------------------------
   * 10. SENSIBILIDAD
   * ------------------------------------------------------------------------ */

  /**
   * Escaños de una lista en función de sus votos, entre (votos + desde) y
   * (votos + hasta), con las demás listas fijas. Devuelve los tramos y los puntos
   * de quiebre exactos (el menor número de votos con el que cambia el resultado).
   */
  function calcularSensibilidad(esc, listaId, rango) {
    if (!validarEscenario(esc).ok) return null;
    var busq = prepararBusqueda(esc);
    var idx = busq.indice[listaId];
    if (idx == null) return null;
    var v = busq.votos[idx];
    var r = rango || {};
    var lo = Math.max(0, v + (r.desde == null ? -v : Math.round(r.desde)));
    var hi = Math.max(lo, v + (r.hasta == null ? v : Math.round(r.hasta)));
    var sLo = escanosCon(busq, idx, lo);
    var sHi = escanosCon(busq, idx, hi);
    var quiebres = [];
    for (var k = sLo + 1; k <= sHi; k++) {
      (function (kk) {
        var b = primerVerdadero(lo, hi, function (V) { return escanosCon(busq, idx, V) >= kk; });
        var ultimo = quiebres.length ? quiebres[quiebres.length - 1] : null;
        if (ultimo && ultimo.votos === b) { ultimo.escanos = kk; } // salto de varios escaños a la vez
        else quiebres.push({ votos: b, delta: b - v, escanos: kk, escanosAntes: kk - 1 });
      })(k);
    }
    var tramos = [];
    var desde = lo, s = sLo;
    quiebres.forEach(function (q) {
      tramos.push({ votosDesde: desde, votosHasta: q.votos - 1, deltaDesde: desde - v, deltaHasta: q.votos - 1 - v, escanos: s });
      desde = q.votos; s = q.escanos;
    });
    tramos.push({ votosDesde: desde, votosHasta: hi, deltaDesde: desde - v, deltaHasta: hi - v, escanos: s });
    return {
      listaId: listaId, idx: idx, votos: v,
      escanosActuales: escanosCon(busq, idx, v),
      votosMin: lo, votosMax: hi, deltaMin: lo - v, deltaMax: hi - v,
      escanosMin: sLo, escanosMax: sHi,
      tramos: tramos, quiebres: quiebres
    };
  }

  /** Escaños de la lista para una serie de cambios de votos concretos (tabla de sensibilidad / escalera). */
  function escanosPorCambio(esc, listaId, deltas) {
    if (!validarEscenario(esc).ok) return null;
    var busq = prepararBusqueda(esc);
    var idx = busq.indice[listaId];
    if (idx == null) return null;
    var v = busq.votos[idx];
    return deltas.map(function (d) {
      var V = Math.max(0, v + d);
      return { delta: V - v, votos: V, escanos: escanosCon(busq, idx, V) };
    });
  }

  /** Paso "redondo" (1, 2, 5 × 10^n) menor o igual que x. */
  function pasoRedondo(x) {
    if (!(x >= 1)) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(x)));
    var m = x / p;
    return (m >= 5 ? 5 : m >= 2 ? 2 : 1) * p;
  }

  /* --------------------------------------------------------------------------
   * 8. COMPARACIÓN DE ESCENARIOS
   * ------------------------------------------------------------------------ */

  /**
   * Compara varios escenarios. `items` = [{ id, nombre, escenario }]. El primero
   * es la referencia de la columna "cambio". Las listas se emparejan por id y,
   * si no coincide, por nombre.
   */
  function compararEscenarios(items) {
    var columnas = items.map(function (it) {
      var r = asignarEscanos(it.escenario);
      return { id: it.id, nombre: it.nombre, escenario: it.escenario, resultado: r, ok: r.ok };
    });
    var filas = [];
    var porId = {}, porNombre = {};
    columnas.forEach(function (col, c) {
      col.escenario.listas.forEach(function (l, i) {
        var clave = normalizarNombre(l.nombre);
        var fila = porId[l.id] || null;
        if (fila && fila.celdas[c]) fila = null; // id repetido dentro del mismo escenario
        if (!fila && clave && porNombre[clave] && !porNombre[clave].celdas[c]) fila = porNombre[clave];
        if (!fila) {
          fila = { clave: l.id, nombre: l.nombre, celdas: columnas.map(function () { return null; }) };
          filas.push(fila);
        }
        if (!porId[l.id]) porId[l.id] = fila;
        if (clave && !porNombre[clave]) porNombre[clave] = fila;
        fila.celdas[c] = {
          votos: l.votos,
          escanos: col.ok ? col.resultado.listas[i].escanos : null,
          pct: col.ok ? col.resultado.listas[i].pct : null,
          elegible: col.ok ? col.resultado.listas[i].elegible : null
        };
      });
    });
    filas.forEach(function (f) {
      var ref = f.celdas[0];
      f.cambios = f.celdas.map(function (c, i) {
        if (i === 0) return null;
        var a = ref && ref.escanos != null ? ref.escanos : 0;
        var b = c && c.escanos != null ? c.escanos : 0;
        return { escanos: b - a, votos: (c ? c.votos : 0) - (ref ? ref.votos : 0) };
      });
      f.difiere = f.cambios.some(function (c) { return c && c.escanos !== 0; });
    });
    return {
      columnas: columnas.map(function (c) {
        return { id: c.id, nombre: c.nombre, ok: c.ok,
                 metodo: c.ok ? c.resultado.metodo : null,
                 escanos: c.escenario.escanos,
                 umbral: Number(c.escenario.umbral) || 0,
                 votos: c.ok ? c.resultado.totales.votosListas : null,
                 errores: c.ok ? [] : c.resultado.bloqueantes };
      }),
      filas: filas,
      hayDiferencias: filas.some(function (f) { return f.difiere; })
    };
  }

  /* --------------------------------------------------------------------------
   * 9. COMPARACIÓN DE MÉTODOS
   * ------------------------------------------------------------------------ */

  /**
   * Reparte el mismo escenario con cada método y explica las diferencias respecto
   * al método del escenario: qué cociente entra o queda fuera en cada caso.
   */
  function compararMetodos(esc, ids) {
    var claves = ids || Object.keys(METODOS);
    var metodos = claves.map(function (id) {
      var copia = {};
      for (var k in esc) copia[k] = esc[k];
      copia.metodo = id;
      return { id: id, nombre: METODOS[id].nombre, nombreLargo: METODOS[id].nombreLargo, serie: METODOS[id].serie, resultado: asignarEscanos(copia) };
    });
    if (metodos.some(function (m) { return !m.resultado.ok; })) {
      return { ok: false, metodos: metodos, filas: [], diferencias: [], hayDiferencias: false };
    }
    var filas = esc.listas.map(function (l, i) {
      var escanos = {};
      metodos.forEach(function (m) { escanos[m.id] = m.resultado.listas[i].escanos; });
      var valores = metodos.map(function (m) { return escanos[m.id]; });
      return { listaId: l.id, idx: i, nombre: l.nombre, votos: l.votos, escanos: escanos,
               difiere: valores.some(function (v) { return v !== valores[0]; }) };
    });

    var ref = null;
    metodos.forEach(function (m) { if (m.id === esc.metodo) ref = m; });
    ref = ref || metodos[0];
    var diferencias = [];
    metodos.forEach(function (otro) {
      if (otro.id === ref.id) return;
      var cambios = [];
      esc.listas.forEach(function (l, i) {
        var a = ref.resultado.listas[i].escanos, b = otro.resultado.listas[i].escanos;
        if (a === b) return;
        // Escaño en disputa: el primero que la lista tiene con un método y no con el otro.
        var k = Math.min(a, b) + 1;
        var dRef = METODOS[ref.id].divisor(k), dOtro = METODOS[otro.id].divisor(k);
        dRef = { n: dRef.n, d: dRef.d, valor: dRef.n / dRef.d };
        dOtro = { n: dOtro.n, d: dOtro.d, valor: dOtro.n / dOtro.d };
        cambios.push({
          listaId: l.id, idx: i, nombre: l.nombre, votos: l.votos,
          conRef: a, conOtro: b, delta: b - a, k: k,
          enRef: { divisor: dRef, cociente: valorCociente(l.votos, dRef), entra: a >= k },
          enOtro: { divisor: dOtro, cociente: valorCociente(l.votos, dOtro), entra: b >= k }
        });
      });
      diferencias.push({
        ref: { id: ref.id, nombre: ref.nombre, corte: ref.resultado.corte.ultimoGanador },
        otro: { id: otro.id, nombre: otro.nombre, corte: otro.resultado.corte.ultimoGanador },
        cambios: cambios,
        iguales: cambios.length === 0
      });
    });
    return {
      ok: true,
      referencia: ref.id,
      metodos: metodos,
      filas: filas,
      diferencias: diferencias,
      hayDiferencias: filas.some(function (f) { return f.difiere; })
    };
  }

  /* --------------------------------------------------------------------------
   * API PÚBLICA
   * ------------------------------------------------------------------------ */
  return {
    VERSION: VERSION,
    METODOS: METODOS,
    REGLAS_DESEMPATE: REGLAS_DESEMPATE,
    BASES_CALCULO: BASES_CALCULO,
    CORTES_VIABILIDAD: CORTES_VIABILIDAD,
    NIVELES_VIABILIDAD: NIVELES_VIABILIDAD,
    MAX_ESCANOS: MAX_ESCANOS,
    MAX_VOTOS: MAX_VOTOS,
    registrarMetodo: registrarMetodo,
    validarEscenario: validarEscenario,
    calcularPorcentajes: calcularPorcentajes,          // 1
    generarCocientes: generarCocientes,                // 2
    ordenarCocientes: ordenarCocientes,                // 3
    asignarEscanos: asignarEscanos,                    // 4
    siguienteEscano: siguienteEscano,                  // 5
    votosAdicionalesNecesarios: votosAdicionalesNecesarios, // 6
    votosParaPerderEscano: votosParaPerderEscano,      // 7
    compararEscenarios: compararEscenarios,            // 8
    compararMetodos: compararMetodos,                  // 9
    calcularSensibilidad: calcularSensibilidad,        // 10
    contarEscanos: contarEscanos,
    analizarMargenes: analizarMargenes,
    seguridadPorEscano: seguridadPorEscano,
    trasvaseMinimo: trasvaseMinimo,
    votosParaAlcanzarUmbral: votosParaAlcanzarUmbral,
    votosMinimosPara: votosMinimosPara,
    escanosPorCambio: escanosPorCambio,
    clasificarViabilidad: clasificarViabilidad,
    pasoRedondo: pasoRedondo,
    normalizarNombre: normalizarNombre,
    // utilidades exactas, expuestas para pruebas y auditoría
    _escanosConVotos: function (esc, listaId, V, generico) {
      var busq = prepararBusqueda(esc);
      var idx = busq.indice[listaId];
      return generico ? escanosConGenerico(busq, idx, V) : escanosCon(busq, idx, V);
    },
    _cmpFraccion: cmpFraccion,
    _cmpCocientes: cmpCocientes,
    _superaUmbral: superaUmbral,
    _umbralEnMillonesimas: umbralEnMillonesimas
  };
});
</script>

    const cerca = margenes && margenes.masCercana ? { nombre: (esc.listas.find((l) => l.id === margenes.masCercana.listaId) || {}).nombre || margenes.masCercana.nombre, adicionales: margenes.masCercana.proximo.adicionales, numero: margenes.masCercana.proximo.numero } : null;
    const empate = (res.empates || []).find((e) => e.decisivo) || null;

    // Participación del distrito, tal como la muestra el tablero (bloque
    // Participación). Se usa solo si cuadra con lo que tiene el simulador; si
    // no (simulador abierto suelto), lo que el simulador sabe por sí mismo.
    const esVoc = !!(o && o.parroquia);
    const pt = delTablero(esVoc ? 'typeof cuentaParticipacionVoc === "function" ? cuentaParticipacionVoc() : null' : 'typeof cuentaParticipacion === "function" ? cuentaParticipacion() : null');
    const vDisp = Number(esc.validosDisponibles) || 0;
    const bl = Math.max(0, Math.round(Number(esc.blancos) || 0)), nu = Math.max(0, Math.round(Number(esc.nulos) || 0));
    let part;
    if (pt && pt.valido && vDisp > 0 && pt.validos === vDisp && pt.blancos === bl && pt.nulos === nu) {
      part = { completo: true, electores: pt.E, ausentes: pt.ausentes, pa: pt.pa, emitidos: pt.emitidos, blancos: pt.blancos, pb: pt.pb, nulos: pt.nulos, pn: pt.pn, validos: pt.validos, pv: pt.pv };
    } else {
      const v = vDisp || (res.totales ? res.totales.votosListas : 0), em = v + bl + nu;
      part = { completo: false, electores: null, ausentes: null, pa: null, emitidos: em, blancos: bl, pb: em > 0 ? bl * 100 / em : 0, nulos: nu, pn: em > 0 ? nu * 100 / em : 0, validos: v, pv: em > 0 ? v * 100 / em : 0 };
    }

    // Cocientes electorales: la misma tabla del simulador (mismos divisores
    // visibles, mismos decimales, orden de adjudicación y primer excluido).
    const maxEscL = res.listas.reduce((m2, l) => Math.max(m2, l.escanos), 0);
    const nCols = ui && ui.matrizTodo ? S : Math.min(S, Math.max(5, maxEscL + 2));
    const matC = Motor.generarCocientes(esc, nCols);
    const decC = ui && ui.decimales === 2 ? 2 : 0;
    const sumaListas = esc.listas.reduce((a, x) => a + (Number(x.votos) || 0), 0);
    const baseValidos = vDisp || (base && base.listas ? base.listas.reduce((a, x) => a + (Number(x.votos) || 0), 0) : 0) || sumaListas;
    const ordenDe = {};
    res.adjudicacion.forEach((a) => {
      ordenDe[a.listaId + "|" + a.k] = a.numero;
    });
    const exC = res.corte.primerExcluido;
    const porIdEsc = {};
    esc.listas.forEach((l) => {
      porIdEsc[l.id] = l;
    });
    const coc = {
      divisores: matC.divisores.map((dv) => fmtDivisor(dv)), baseValidos, sumaListas,
      filas: matC.filas.map((f) => {
        const l = porIdEsc[f.listaId] || {};
        return {
          id: f.listaId, nombre: l.nombre || f.nombre || "Sin nombre", color: colorDe(l), votos: Number(l.votos) || 0,
          pct: baseValidos ? (Number(l.votos) || 0) * 100 / baseValidos : 0,
          escanos: res.listas[f.idx] ? res.listas[f.idx].escanos : 0, elegible: f.elegible, motivo: f.motivoExclusion,
          cocientes: f.cocientes.map((q) => ({
            texto: fmtCociente(q.cociente, decC),
            numero: f.elegible ? ordenDe[f.listaId + "|" + q.k] || null : null,
            fuera: !!(f.elegible && exC && exC.listaId === f.listaId && exC.k === q.k)
          }))
        };
      })
    };
    coc.sumaPct = coc.filas.reduce((a, f) => a + f.pct, 0);

    // «¿Qué pasa si…?»: lo mismo que cada fila del simulador de votos (votos,
    // cambio frente a la tabla, escaños con sus puestos y los votos mínimo y
    // máximo con que los conserva) y los votos que le faltan para uno más.
    const sim = modoReparto ? null : esc.listas.map((l, i) => {
      const s = res.listas[i].escanos;
      const min = s > 0 ? Motor.votosMinimosPara(esc, l.id, s) : 0;
      const sig = s < S ? Motor.votosMinimosPara(esc, l.id, s + 1) : null;
      const b = porIdBase[l.id];
      const vb = b ? Number(b.l.votos) || 0 : null;
      const rb = b && resBase.ok ? resBase.listas[b.i] : null;
      const votos = Number(l.votos) || 0;
      return {
        id: l.id, nombre: l.nombre || "Sin nombre", color: colorDe(l), votos,
        delta: vb != null ? votos - vb : 0, pctDelta: vb > 0 ? (votos - vb) * 100 / vb : null,
        escanos: s, escBase: rb ? rb.escanos : null, puestos: s > 0 ? posicionesDe(res, l.id) : "",
        todos: s >= S, min, max: sig != null ? sig - 1 : null, falta: sig != null ? Math.max(0, sig - votos) : null
      };
    });

    // Estabilidad y cambios en la representación: el mismo análisis de la
    // sección del simulador, con la amplitud que esté elegida allí.
    let est = null;
    const amp = AMPLITUDES_EST.includes(ui && ui.estAmplitud) ? ui.estAmplitud : 2;
    const A = res.ok !== false ? analizarEstabilidad(esc, res, amp, B) : null;
    if (A) {
      const nombreK = (k) => partesOrg(esc.listas[k]).completo;
      const frac = A.N ? A.conCambio / A.N : 0;
      const filasE = A.porOrg.filter((x) => (Number(esc.listas[x.k].votos) || 0) > 0).map((x) => Object.assign({}, x, { act: A.actual[x.k], l: esc.listas[x.k], est: estadoOrg(x, A.actual[x.k]) }));
      filasE.sort((a, b) => {
        if ((a.act > 0) !== (b.act > 0)) return a.act > 0 ? -1 : 1;
        if (a.act > 0) return b.mantiene - a.mantiene || b.act - a.act || b.l.votos - a.l.votos;
        if ((a.max > 0) !== (b.max > 0)) return a.max > 0 ? -1 : 1;
        return b.l.votos - a.l.votos;
      });
      const pctDe = (n) => A.N ? n * 100 / A.N : 0;
      est = {
        amp, N: A.N, conVotos: A.conVotos, firmes: A.firmes, enJuego: S - A.firmes, conCambio: A.conCambio, frac,
        maxMovidos: A.maxMovidos, niv: nivelSensibilidad(frac), sinVotos: A.sinVotos,
        estables: filasE.filter((f) => f.act > 0 && f.est.c === "estable").length,
        conEscano: filasE.filter((f) => f.act > 0).length,
        filas: filasE.filter((f) => !(f.act === 0 && f.max === 0)).map((f) => ({
          nombre: nombreK(f.k), color: colorDe(f.l), act: f.act, min: f.min, max: f.max,
          mantiene: pctDe(f.mantiene), gana: pctDe(f.gana), pierde: pctDe(f.pierde), est: f.est
        })),
        sin: filasE.filter((f) => f.act === 0 && f.max === 0).map((f) => nombreK(f.k))
      };
    }

    // Territorio, tal como lo manda el tablero (nombres sin tocar). Concejales
    // no manda la provincia ni el año de la participación: se leen del tablero.
    const delAsig = o && !o.provincia && !o.parroquia ? delTablero('typeof ASIG !== "undefined" && ASIG.origen && ASIG.origen.provK && typeof ambitoTexto === "function" ? { provincia: ambitoTexto({ provK: ASIG.origen.provK }), anio: ASIG.sinReferencia ? null : ASIG.origen.anio || null } : null') : null;
    const terr = {
      provincia: o && o.provincia || delAsig && delAsig.provincia || "", canton: o && (o.canton || o.ambito) || "", parroquia: o && o.parroquia || "",
      circunscripcion: o && o.circunscripcion || "", dignidad: o && o.dignidad || "", anio: o && o.anio || null
    };
    const partesLugar = [terr.parroquia ? "Parroquia " + terr.parroquia : "", terr.canton, terr.circunscripcion].filter(Boolean);
    const lugar = partesLugar.length ? partesLugar.join(" · ") : "Escenario propio del simulador";
    const etiquetaEsc = tipo === "referencia" ? "Distribución de referencia (sin cambios)" : tipo === "simulado" ? "Escenario hipotético · " + fmtEntero(difs.length) + " " + plural(difs.length, "cambio", "cambios") : "Escenario «Nuevo»: reparto propuesto";
    const metodo = Motor.METODOS[esc.metodo] || {};
    const regla = Motor.REGLAS_DESEMPATE[res.desempate] || {};
    const fuenteEsc = o ? o.escanosDe === "inscritos" ? "Registro de inscripción de candidaturas: cada lista inscribe tantos candidatos principales como escaños se eligen" + (o.escanosParejo === false ? " (algunas listas inscribieron menos; se tomó el número mayor)." : ".") : "Tabla oficial de escaños de la elección de 2023 (el registro de inscripción no trae candidatos para este distrito)." : "Número de escaños escrito en el simulador.";
    const R = {
      generado: ahora, fechaLarga: fechaLargaRP(ahora),
      fechaCorta: dos(ahora.getDate()) + "/" + dos(ahora.getMonth() + 1) + "/" + ahora.getFullYear() + " " + dos(ahora.getHours()) + ":" + dos(ahora.getMinutes()),
      tipo, etiquetaEsc, terr, lugar, T: terminosRP(T), origen: o,
      anioPart: o && Number.isInteger(o.anioParticipacion) ? o.anioParticipacion : delAsig && Number.isInteger(delAsig.anio) ? delAsig.anio : null,
      metodo: { nombre: metodo.nombreLargo || metodo.nombre || res.metodo.nombre, serie: metodo.serie || res.metodo.serie, descripcion: metodo.descripcion || "" },
      regla: { nombre: regla.nombre || res.desempate, descripcion: regla.descripcion || "" },
      S, Sbase: base.escanos, umbral: Number(esc.umbral) || 0, baseModo: (Motor.BASES_CALCULO[esc.baseModo] || {}).nombre || "",
      B, disponibles: Number(esc.validosDisponibles) || 0,
      totRef: resBase.ok ? resBase.totales : null, totSim: res.totales,
      filas, adjudicacion, corte, part, coc, sim, est,
      cambiosVotos, otrosCambios, reparto, cerca, empate, fuenteEsc,
      hayRef: resBase.ok,
      oficial: o && o.oficial ? o.oficial : null
    };
    R.cambianDeManos = tipo === "simulado" ? filas.reduce((s, f) => s + (f.dif > 0 ? f.dif : 0), 0) : 0;
    R.conEscano = filas.filter((f) => (f.escSim || 0) > 0).length;
    R.hallazgos = hallazgosRP(R);
    R.tituloDoc = "Reporte de Simulación Electoral – " + lugar;
    R.asunto = [terr.dignidad, etiquetaEsc].filter(Boolean).join(" · ");
    R.palabras = ["simulación electoral", "escaños", R.metodo.nombre, terr.canton, terr.circunscripcion, terr.parroquia].filter(Boolean).join(", ");
    R.archivo = "reporte_simulacion_" + [slugRP(terr.canton), slugRP(terr.parroquia), slugRP(terr.circunscripcion)].filter(Boolean).join("_").replace(/^$/, "escenario") + "_" + ahora.getFullYear() + "-" + dos(ahora.getMonth() + 1) + "-" + dos(ahora.getDate()) + "_" + dos(ahora.getHours()) + dos(ahora.getMinutes()) + ".pdf";
    return R;
  }

  /** Frases del resumen ejecutivo: solo hechos que salen de los datos. */
  function hallazgosRP(R) {
    const out = [];
    const T = R.T;
    if (R.tipo === "referencia") {
      out.push("No se modificó ningún voto: el reporte muestra la distribución de referencia, calculada con los votos de la tabla de cocientes.");
    } else if (R.tipo === "reparto") {
      out.push("Escenario «Nuevo»: se propone un reparto de " + fmtEntero(R.reparto ? R.reparto.usados : 0) + " de " + escRP(R.S) + (R.reparto && R.reparto.restante > 0 ? " (falta" + (R.reparto.restante === 1 ? " 1 escaño" : "n " + escRP(R.reparto.restante)) + " por asignar)" : "") + ". La sección «Simulador: ¿qué pasa si…?» indica los votos mínimos y máximos con los que cada " + T.sing + " lo obtendría si el resto conserva sus votos de referencia.");
      out.push("La composición, los cocientes electorales y el orden de adjudicación corresponden a la distribución de referencia, calculada con los votos de la tabla de cocientes.");
    }
    if (R.tipo === "simulado") {
      if (R.cambiosVotos.length) {
        const partes = R.cambiosVotos.slice(0, 6).map((x) => x.nombre + " " + fmtSigno(x.delta) + " (de " + fmtEntero(x.de) + " a " + fmtEntero(x.a) + ")");
        out.push("Cambios de votos simulados en " + fmtEntero(R.cambiosVotos.length) + " " + plural(R.cambiosVotos.length, T.sing, T.plur) + ": " + listaDe(partes) + (R.cambiosVotos.length > 6 ? " y " + fmtEntero(R.cambiosVotos.length - 6) + " más" : "") + ".");
      }
      R.otrosCambios.forEach((x) => {
        if (x.tipo === "escanos") out.push("El número de escaños pasa de " + fmtEntero(x.de) + " a " + fmtEntero(x.a) + " en la simulación.");
        else if (x.tipo === "umbral") out.push("El umbral pasa de " + fmtUmbral(x.de) + " a " + fmtUmbral(x.a) + ".");
        else if (x.tipo === "metodo") out.push("El método cambia en la simulación.");
      });
      const ganan = R.filas.filter((f) => f.dif > 0).map((f) => f.nombre + " (de " + fmtEntero(f.escRef) + " a " + fmtEntero(f.escSim) + ")");
      const pierden = R.filas.filter((f) => f.dif < 0).map((f) => f.nombre + " (de " + fmtEntero(f.escRef) + " a " + fmtEntero(f.escSim) + ")");
      const conservan = R.filas.filter((f) => f.dif === 0 && f.escSim > 0).map((f) => f.nombre + " (" + fmtEntero(f.escSim) + ")");
      if (!ganan.length && !pierden.length) out.push("La distribución de escaños no cambia frente a la referencia: cada " + T.sing + " conserva sus escaños.");
      else {
        if (ganan.length) out.push(plural(ganan.length, "Gana", "Ganan") + " escaños: " + listaDe(ganan) + ".");
        if (pierden.length) out.push(plural(pierden.length, "Pierde", "Pierden") + " escaños: " + listaDe(pierden) + ".");
      }
      if (conservan.length && (ganan.length || pierden.length)) out.push(plural(conservan.length, "Conserva", "Conservan") + " sus escaños: " + listaDe(conservan) + ".");
    }
    const u = R.corte && R.corte.ultimoGanador, x = R.corte && R.corte.primerExcluido;
    if (u) {
      let t = "El último escaño (" + ordinal(u.numero) + ") es para " + u.nombre + ", con un cociente de " + fmtDecimal(u.cociente, 2) + " (" + fmtEntero(u.votos) + " ÷ " + fmtDivisor(u.divisor) + ").";
      if (x) t += " El primer cociente que queda sin escaño es el de " + x.nombre + " (" + fmtEntero(x.votos) + " ÷ " + fmtDivisor(x.divisor) + " = " + fmtDecimal(x.cociente, 2) + ").";
      out.push(t);
    }
    if (R.cerca) out.push("Más cerca de un escaño adicional está " + R.cerca.nombre + ": le faltan " + fmtEntero(R.cerca.adicionales) + " " + plural(R.cerca.adicionales, "voto", "votos") + " para el " + ordinal(R.cerca.numero) + " escaño, si el resto conserva sus votos.");
    if (R.empate) out.push("Hay un empate exacto de cocientes en el último escaño: se resolvió con la regla «" + R.regla.nombre + "». Conviene verificar la regla de desempate aplicable.");
    return out;
  }

  /* ---------------------------------------------------------------- marca */
  function rasterizarLogo(img, fondo) {
    const lado = 192;
    const w0 = img.naturalWidth || img.width || lado, h0 = img.naturalHeight || img.height || lado;
    const k = Math.min(lado / w0, lado / h0);
    const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const cv = document.createElement("canvas");
    cv.width = w;
    cv.height = h;
    const cx = cv.getContext("2d");
    cx.fillStyle = fondo;
    cx.fillRect(0, 0, w, h);
    cx.drawImage(img, 0, 0, w, h);
    const url = cv.toDataURL("image/jpeg", 0.92);
    if (url.indexOf("data:image/jpeg") !== 0) throw new Error("sin JPEG");
    return { datos: atob(url.split(",")[1]), ancho: w, alto: h };
  }
  function cargarLogo(url) {
    return new Promise((resolver) => {
      let hecho = false;
      const fin = (x) => {
        if (!hecho) {
          hecho = true;
          resolver(x);
        }
      };
      const t = setTimeout(() => fin(null), 2500);
      const img = new Image();
      img.onload = () => {
        clearTimeout(t);
        try {
          fin({ banda: rasterizarLogo(img, TONOS.marino), blanco: rasterizarLogo(img, "#ffffff") });
        } catch (e) {
          fin(null);
        }
      };
      img.onerror = () => {
        clearTimeout(t);
        fin(null);
      };
      img.src = url;
    });
  }
  /** Marca del tablero que envuelve al simulador (textos y logo de
      CONFIG.marca). Sin tablero, los textos de siempre y el logo del proyecto. */
  async function marcaReporte() {
    const marca = delTablero('typeof CONFIG !== "undefined" && CONFIG.marca ? CONFIG.marca : null');
    let desde = null;
    try {
      if (marca) desde = window.parent.location.href;
    } catch (e) {
    }
    let url = null;
    try {
      url = marca && marca.logo ? new URL(marca.logo, desde).href : new URL("../assets/logo.svg", window.location.href).href;
    } catch (e) {
    }
    return {
      titulo: marca && marca.titulo || "ANÁLISIS ELECTORAL TERRITORIAL",
      empresa: marca && marca.empresa || "INTELIGENCIA TERRITORIAL",
      ciclo: marca && marca.ciclo || "",
      logo: url ? await cargarLogo(url) : null
    };
  }

  /* -------------------------------------------------------------- dibujo */
  function dibujarReporte(R, marca) {
    const { W, H, M } = RP;
    const CW = W - 2 * M;
    const LIM = H - RP.INF - 18;
    const doc = PDFMini.crear({ titulo: R.tituloDoc, autor: marca.empresa, asunto: R.asunto, palabras: R.palabras, creador: marca.titulo + " · Simulador de escaños", fecha: R.generado });
    const imBanda = marca.logo ? doc.jpeg(marca.logo.banda) : null;
    const imBlanco = marca.logo ? doc.jpeg(marca.logo.blanco) : null;
    const T = R.T;
    let y = 0;

    function logoVector(x, yy, lado) {
      const s = lado / 44;
      doc.rect(x + s, yy + s, 42 * s, 42 * s, { relleno: "#131f33", borde: "#2b3f5e", grosor: s, radio: 10 * s });
      doc.ruta([[9, 29.5], [15.5, 17], [22, 24], [28.5, 11.5], [35, 29.5]].map((p) => [x + p[0] * s, yy + p[1] * s]), { borde: "#f5b44a", grosor: 2.4 * s, redondo: true });
      doc.circulo(x + 28.5 * s, yy + 11.5 * s, 3 * s, { relleno: "#4ed8cb" });
      doc.linea(x + 9 * s, yy + 33.5 * s, x + 35 * s, yy + 33.5 * s, { borde: "#2b3f5e", grosor: 1.6 * s, redondo: true });
      return lado;
    }
    function logo(x, yy, lado, enBanda) {
      const im = enBanda ? imBanda : imBlanco;
      if (!im) return logoVector(x, yy, lado);
      const d = enBanda ? marca.logo.banda : marca.logo.blanco;
      const r = d.ancho / d.alto;
      const w = r >= 1 ? lado : lado * r, h = r >= 1 ? lado / r : lado;
      doc.imagen(im, x, yy + (lado - h) / 2, w, h);
      return w;
    }
    /** Texto que debe caber en `max`: se achica hasta `minTam` y, si aun así
        no cabe, se parte en líneas (nunca se recorta). Devuelve las líneas. */
    function ajustar(texto, max, fuente, tam, minTam) {
      let t = tam;
      while (t > minTam && doc.ancho(texto, fuente, t) > max) t -= 0.25;
      return { tam: t, lineas: doc.partir(texto, max, fuente, t) };
    }
    function encabezado() {
      const top = 24;
      const wl = logo(M, top, 16, false);
      doc.texto("Reporte de Simulación Electoral", M + wl + 7, top + 11.5, { tam: 8.5, fuente: "negrita", color: TONOS.marino });
      const der = [R.lugar, R.terr.dignidad].filter(Boolean).join(" · ");
      const a = ajustar(der, CW - wl - 190, "normal", 7.5, 6.5);
      a.lineas.slice(0, 2).forEach((l, i) => doc.texto(l, W - M, top + 11.5 + i * 8.5 - (a.lineas.length > 1 ? 4 : 0), { tam: a.tam, color: TONOS.gris, alinear: "der" }));
      doc.linea(M, top + 22, W - M, top + 22, { borde: TONOS.linea, grosor: 0.6 });
    }
    function nuevaPagina() {
      doc.nuevaPagina();
      encabezado();
      y = RP.SUP + 10;
    }
    function asegurar(h) {
      if (y + h > LIM) {
        nuevaPagina();
        return true;
      }
      return false;
    }
    function seccion(titulo, sub, siguiente) {
      const lineasSub = sub ? doc.partir(sub, CW, "normal", 8.5) : [];
      const alto = 24 + lineasSub.length * 11.5 + 6;
      asegurar(alto + (siguiente || 80));
      doc.marcador(titulo, y);
      doc.rect(M, y + 1.5, 3.2, 14, { relleno: TONOS.ambar, radio: 1.2 });
      doc.texto(titulo, M + 10, y + 13, { tam: 13.5, fuente: "negrita", color: TONOS.marino });
      y += 22;
      if (lineasSub.length) {
        doc.parrafo(lineasSub, M, y + 7, CW, { tam: 8.5, color: TONOS.gris, interlineado: 11.5 });
        y += lineasSub.length * 11.5;
      }
      y += 8;
    }
    function subtitulo(t, siguiente) {
      asegurar(22 + (siguiente || 60));
      doc.texto(t, M, y + 10, { tam: 10, fuente: "negrita", color: TONOS.tinta });
      y += 18;
    }
    function nota(t, est) {
      const e = est || {};
      const tam = e.tam || 7.8, il = tam * 1.38;
      const ls = doc.partir(t, CW, e.fuente || "cursiva", tam);
      asegurar(ls.length * il + 4);
      doc.parrafo(ls, M, y + tam, CW, { tam, fuente: e.fuente || "cursiva", color: e.color || TONOS.gris, interlineado: il });
      y += ls.length * il + (e.despues != null ? e.despues : 8);
    }
    function punto(x, cy, r, c) {
      if (c && c.hueco) doc.circulo(x, cy, r - 0.6, { relleno: TONOS.blanco, borde: c.hex, grosor: 1.3 });
      else doc.circulo(x, cy, r, { relleno: c ? c.hex : TONOS.gris });
    }

    /* Tabla con encabezado que se repite en cada página y filas que nunca se
       parten. cols: [{t, w, al}] (al: 'izq' | 'der' | 'centro'); filas:
       [{c: [celda…], total}] con celda = texto o {t, color, fuente, punto,
       fondo, marco, sup, colorSup, barra}: fondo pinta la celda, marco la
       rodea con un borde punteado, sup añade un superíndice y barra dibuja
       debajo una barrita apilada [{f: 0…1, color}]. */
    function tabla(cols, filas, opc) {
      const o = opc || {};
      const tam = o.tam || 8.4, il = tam * 1.3, pad = o.pad != null ? o.pad : 5.2;
      const tamSup = tam * 0.68;
      const xs = [];
      let acc = M;
      cols.forEach((c) => {
        xs.push(acc);
        acc += c.w;
      });
      const anchoT = acc - M;
      const textoDe = (cel) => cel == null ? "" : typeof cel === "object" ? String(cel.t == null ? "" : cel.t) : String(cel);
      const anchoSup = (cel) => cel && typeof cel === "object" && cel.sup != null ? doc.ancho(String(cel.sup), "negrita", tamSup) + 1.4 : 0;
      const lineas = (cel, c, cab, total) => {
        const f = cab || total ? "negrita" : cel && typeof cel === "object" && cel.fuente || "normal";
        const extra = (cel && typeof cel === "object" && cel.punto ? 10 : 0) + anchoSup(cel);
        return doc.partir(textoDe(cel), Math.max(8, c.w - 2 * pad - extra), f, cab ? tam - 0.6 : tam);
      };
      const alto = (celdas, cab, total) => celdas.reduce((mx, cel, i) => Math.max(mx, lineas(cel, cols[i], cab, total).length * il + (cel && typeof cel === "object" && cel.barra ? 7 : 0)), il) + 2 * pad;
      const xTexto = (i, c) => c.al === "der" ? xs[i] + c.w - pad : c.al === "centro" ? xs[i] + c.w / 2 : xs[i] + pad;
      const alinear = (c) => c.al === "der" ? "der" : c.al === "centro" ? "centro" : "izq";
      const hCab = alto(cols.map((c) => c.t), true);
      function cabecera() {
        doc.rect(M, y, anchoT, hCab, { relleno: TONOS.marino });
        cols.forEach((c, i) => {
          const ls = lineas(c.t, c, true);
          const y0 = y + hCab - pad - (ls.length - 1) * il - (il - tam) / 2 - tam * 0.2;
          ls.forEach((l, k) => doc.texto(l, xTexto(i, c), y0 + k * il, { tam: tam - 0.6, fuente: "negrita", color: TONOS.blanco, alinear: alinear(c) }));
        });
        y += hCab;
      }
      if (!filas.length) return;
      if (y + hCab + alto(filas[0].c, false, filas[0].total) > LIM) nuevaPagina();
      cabecera();
      filas.forEach((f, r) => {
        const h = alto(f.c, false, f.total);
        if (y + h > LIM) {
          nuevaPagina();
          if (o.continua) {
            doc.texto(o.continua + " (continuación)", M, y + 9, { tam: 8, fuente: "cursiva", color: TONOS.gris });
            y += 15;
          }
          cabecera();
        }
        if (f.total) doc.rect(M, y, anchoT, h, { relleno: TONOS.fondo2 });
        else if (r % 2 === 1) doc.rect(M, y, anchoT, h, { relleno: TONOS.fondo });
        f.c.forEach((cel, i) => {
          const c = cols[i];
          const ls = lineas(cel, c, false, f.total);
          const obj = cel && typeof cel === "object" ? cel : {};
          const fuente = f.total ? "negrita" : obj.fuente || "normal";
          if (obj.fondo) doc.rect(xs[i] + 1.4, y + 1.4, c.w - 2.8, h - 2.8, { relleno: obj.fondo, radio: 2 });
          if (obj.marco) doc.rect(xs[i] + 1.8, y + 1.8, c.w - 3.6, h - 3.6, { borde: obj.marco, grosor: 0.9, discontinua: [2.2, 1.6], radio: 2 });
          let x = xTexto(i, c);
          const yb = y + pad + (il - tam) / 2 + tam * 0.8;
          if (obj.punto) {
            punto(xs[i] + pad + 3.5, yb - tam * 0.32, 3.4, obj.punto);
            if (alinear(c) === "izq") x += 10;
          }
          const wSup = anchoSup(obj);
          if (wSup && alinear(c) === "der") x -= wSup;
          ls.forEach((l, k) => doc.texto(l, x, yb + k * il, { tam, fuente, color: obj.color || TONOS.tinta, alinear: alinear(c) }));
          if (wSup) {
            const xS = alinear(c) === "der" ? x + 1.4 : x + doc.ancho(ls[0] || "", fuente, tam) + 1.4;
            doc.texto(String(obj.sup), xS, yb - tam * 0.36, { tam: tamSup, fuente: "negrita", color: obj.colorSup || obj.color || TONOS.tinta });
          }
          if (obj.barra) {
            const bx = xs[i] + pad, bw = c.w - 2 * pad, by = yb + (ls.length - 1) * il + 4;
            let a2 = 0;
            obj.barra.forEach((b) => {
              const w2 = Math.max(0, Math.min(1, b.f)) * bw;
              if (w2 > 0.05) doc.rect(bx + a2, by, Math.min(w2, bw - a2), 4, { relleno: b.color });
              a2 += w2;
            });
            doc.rect(bx, by, bw, 4, { borde: TONOS.linea, grosor: 0.4 });
          }
        });
        doc.linea(M, y + h, M + anchoT, y + h, { borde: f.total ? TONOS.linea : TONOS.lineaSuave, grosor: f.total ? 0.8 : 0.5 });
        y += h;
      });
      y += o.despues != null ? o.despues : 12;
    }

    /* Una fila de tarjetas con cifra: [{e: etiqueta, v: cifra, s: pie, color,
       foco}]. color pinta una franja a la izquierda; foco, la tarjeta oscura. */
    function filaTarjetas(items, opc) {
      const o2 = opc || {};
      const n = items.length, gap = o2.gap != null ? o2.gap : 8, h = o2.alto || 62;
      const w = (CW - gap * (n - 1)) / n;
      asegurar(h + 10);
      items.forEach((it, i) => {
        const x = M + i * (w + gap);
        doc.rect(x, y, w, h, { relleno: it.foco ? TONOS.marino : TONOS.blanco, borde: it.foco ? TONOS.marino : TONOS.linea, grosor: 0.7, radio: 6 });
        if (it.color) doc.rect(x + 0.35, y + 7, 3, h - 14, { relleno: it.color, radio: 1.5 });
        const x0 = x + (it.color ? 11 : 10), wi = w - (it.color ? 19 : 20);
        const cE = it.foco ? TONOS.banda : it.color || TONOS.gris;
        doc.partir(it.e.toUpperCase(), wi, "negrita", 6.2).slice(0, 2).forEach((l, k) => doc.texto(l, x0, y + 14 + k * 7.6, { tam: 6.2, fuente: "negrita", color: cE, espaciado: 0.3 }));
        const vA = ajustar(it.v, wi, "negrita", o2.tamV || 16, 8.5);
        doc.texto(vA.lineas[0], x0, y + h - 21, { tam: vA.tam, fuente: "negrita", color: it.foco ? TONOS.blanco : TONOS.marino });
        if (it.s) {
          const sA = ajustar(it.s, wi, "normal", 6.8, 5.4);
          doc.texto(sA.lineas[0], x0, y + h - 9.5, { tam: sA.tam, color: it.foco ? TONOS.banda : TONOS.gris });
        }
      });
      y += h + (o2.despues != null ? o2.despues : 12);
    }

    /* =========================== PÁGINA 1 =========================== */
    doc.nuevaPagina();
    const hB = 176;
    doc.rect(0, 0, W, hB, { relleno: TONOS.marino });
    doc.rect(0, hB, W, 2.5, { relleno: TONOS.ambar });
    const wl = logo(M, 28, 30, true);
    const marcaT = ajustar(marca.titulo, 260, "negrita", 8, 6.5);
    doc.texto(marcaT.lineas[0], M + wl + 10, 40, { tam: marcaT.tam, fuente: "negrita", color: TONOS.blanco, espaciado: 0.6 });
    doc.texto([marca.empresa, marca.ciclo].filter(Boolean).join(" · "), M + wl + 10, 52.5, { tam: 7.4, color: TONOS.bandaSuave });
    doc.texto("Generado el " + R.fechaLarga, W - M, 40, { tam: 7.4, color: TONOS.banda, alinear: "der" });
    // Pastilla del escenario
    const pas = R.tipo === "referencia" ? "DISTRIBUCIÓN DE REFERENCIA" : R.tipo === "simulado" ? "ESCENARIO HIPOTÉTICO" : "REPARTO PROPUESTO";
    const wp = doc.ancho(pas, "negrita", 7, 0.8) + 18;
    doc.rect(W - M - wp, 48, wp, 15, { relleno: R.tipo === "referencia" ? "#1d3766" : TONOS.ambar, radio: 7.5 });
    doc.texto(pas, W - M - wp / 2, 58.2, { tam: 7, fuente: "negrita", color: R.tipo === "referencia" ? TONOS.blanco : TONOS.marino, alinear: "centro", espaciado: 0.8 });
    doc.texto("Reporte de Simulación Electoral", M, 104, { tam: 25, fuente: "negrita", color: TONOS.blanco });
    const lugarA = ajustar(R.lugar, CW, "normal", 13.5, 11);
    let yl = 126;
    lugarA.lineas.slice(0, 3).forEach((l) => {
      doc.texto(l, M, yl, { tam: lugarA.tam, color: "#dbe4f5" });
      yl += lugarA.tam + 3.5;
    });
    const lineaDig = [R.terr.dignidad, R.terr.provincia ? "Provincia de " + R.terr.provincia : ""].filter(Boolean).join(" · ");
    if (lineaDig) doc.texto(lineaDig, M, Math.min(hB - 12, yl + 6), { tam: 9.5, fuente: "negrita", color: TONOS.ambar });
    y = hB + 24;

    // Ficha del escenario
    const pares = [];
    if (R.terr.provincia) pares.push(["Provincia", R.terr.provincia]);
    if (R.terr.canton) pares.push(["Cantón", R.terr.canton]);
    if (R.terr.parroquia) pares.push(["Parroquia", R.terr.parroquia]);
    if (R.terr.circunscripcion) pares.push(["Circunscripción", R.terr.circunscripcion]);
    if (R.terr.dignidad) pares.push(["Dignidad", R.terr.dignidad]);
    pares.push(["Escenario", R.etiquetaEsc]);
    pares.push(["Fórmula electoral", R.metodo.nombre + " (divisores " + R.metodo.serie + ")"]);
    pares.push(["Escaños a distribuir", fmtEntero(R.S) + (R.Sbase !== R.S ? " (el distrito elige " + fmtEntero(R.Sbase) + ")" : "")]);
    pares.push(["Fecha y hora del reporte", R.fechaLarga]);
    (function ficha() {
      const colW = (CW - 28 - 16) / 2;
      const celdas = pares.map(([e, v]) => ({ e, ls: doc.partir(v, colW, "negrita", 9.2) }));
      const filasF = [];
      for (let i = 0; i < celdas.length; i += 2) filasF.push([celdas[i], celdas[i + 1]]);
      const altoCelda = (c) => c ? 11 + c.ls.length * 11.5 + 7 : 0;
      const altos = filasF.map((f) => Math.max(altoCelda(f[0]), altoCelda(f[1])));
      const hF = altos.reduce((s, h) => s + h, 0) + 16;
      doc.rect(M, y, CW, hF, { relleno: TONOS.fondo, borde: TONOS.linea, grosor: 0.6, radio: 7 });
      let yy = y + 10;
      filasF.forEach((f, i) => {
        f.forEach((c, j) => {
          if (!c) return;
          const x = M + 14 + j * (colW + 16);
          doc.texto(c.e.toUpperCase(), x, yy + 8, { tam: 6.4, fuente: "negrita", color: TONOS.gris, espaciado: 0.6 });
          doc.parrafo(c.ls, x, yy + 20, colW, { tam: 9.2, fuente: "negrita", color: TONOS.tinta, interlineado: 11.5 });
        });
        yy += altos[i];
      });
      y += hF + 20;
    })();

    /* ====================== 1 · RESUMEN EJECUTIVO ====================== */
    seccion("Resumen ejecutivo", null, 150);
    (function participacion() {
      const P = R.part;
      const COL = { electores: "#2A72C8", ausentismo: "#D4553C", emitidos: "#566070", blancos: "#AE6E0C", nulos: "#1A8F62", validos: "#6B4FBB" };
      doc.texto(P.completo ? "Participación del distrito, como en el bloque Participación del tablero" : "Participación del distrito (la que trae el simulador; sin el tablero no hay padrón ni ausentismo)", M, y + 8, { tam: 7.8, fuente: "negrita", color: TONOS.tinta2 });
      y += 15;
      filaTarjetas([
        { e: "Electores", v: P.electores != null ? fmtEntero(P.electores) : "—", s: P.electores != null ? "electores habilitados" : "no disponible", color: COL.electores },
        { e: "Ausentismo", v: P.pa != null ? fmtPct(P.pa, 2) : "—", s: P.ausentes != null ? fmtEntero(P.ausentes) + " " + plural(P.ausentes, "ausente", "ausentes") : "no disponible", color: COL.ausentismo },
        { e: "Sufragantes", v: fmtEntero(P.emitidos), s: "votos emitidos", color: COL.emitidos },
        { e: "Blancos", v: fmtPct(P.pb, 2), s: fmtEntero(P.blancos) + " votos", color: COL.blancos },
        { e: "Nulos", v: fmtPct(P.pn, 2), s: fmtEntero(P.nulos) + " votos", color: COL.nulos },
        { e: "Válidos", v: fmtEntero(P.validos), s: fmtPct(P.pv, 2) + " de los emitidos", color: COL.validos }
      ], { gap: 7, alto: 60, tamV: 15, despues: 6 });
      const pasos = [];
      if (P.completo) pasos.push(fmtEntero(P.electores) + " electores − " + fmtEntero(P.ausentes) + " ausentes (" + fmtPct(P.pa, 2) + ") = " + fmtEntero(P.emitidos) + " votos emitidos");
      pasos.push(fmtEntero(P.emitidos) + " votos emitidos − " + fmtEntero(P.nulos) + " nulos (" + fmtPct(P.pn, 2) + ") − " + fmtEntero(P.blancos) + " blancos (" + fmtPct(P.pb, 2) + ") = " + fmtEntero(P.validos) + " votos válidos");
      pasos.forEach((tx, k) => {
        const ls = doc.partir((k + 1) + ". " + tx, CW, "normal", 7.6);
        asegurar(ls.length * 10 + 2);
        doc.parrafo(ls, M, y + 8, CW, { tam: 7.6, color: TONOS.tinta2, interlineado: 10 });
        y += ls.length * 10 + 1;
      });
      y += 10;
    })();
    (function tarjetas() {
      const n = R.filas.length;
      filaTarjetas([
        { e: T.Plur + " participantes", v: fmtEntero(n), s: fmtEntero(R.conEscano) + " con escaño" },
        { e: "Escaños a distribuir", v: fmtEntero(R.S), s: "Método " + R.metodo.nombre },
        R.tipo === "simulado" ? { e: "Escaños que cambian de manos", v: fmtEntero(R.cambianDeManos), s: R.cambianDeManos ? "frente a la referencia" : "el reparto se mantiene", foco: true } : R.tipo === "reparto" ? { e: "Escaños propuestos", v: fmtEntero(R.reparto ? R.reparto.usados : 0) + " de " + fmtEntero(R.S), s: R.reparto && R.reparto.restante ? "faltan " + fmtEntero(R.reparto.restante) : "reparto completo", foco: true } : { e: "Escenario", v: "Referencia", s: "sin cambios simulados", foco: true }
      ], { gap: 9, alto: 60, despues: 14 });
    })();
    R.hallazgos.forEach((t) => {
      const ls = doc.partir(t, CW - 14, "normal", 9.2);
      const h = ls.length * 12.6;
      asegurar(h + 5);
      doc.circulo(M + 3, y + 6, 1.9, { relleno: TONOS.ambar });
      doc.parrafo(ls, M + 12, y + 9, CW - 14, { tam: 9.2, color: TONOS.tinta, interlineado: 12.6 });
      y += h + 5;
    });
    y += 8;
    // Composición resultante: un punto por escaño, en el orden de adjudicación.
    (function composicion() {
      const adj = R.adjudicacion;
      if (!adj.length) return;
      const S = adj.length, gap = S > 30 ? 2 : 4;
      const d = Math.max(5, Math.min(17, (CW - gap * (S - 1)) / S));
      const conEsc = R.filas.filter((f) => f.escSim > 0);
      const colW = (CW - 16) / 2;
      const leyenda = conEsc.map((f) => ({ f, ls: doc.partir(f.nombre + " — " + escRP(f.escSim) + ": " + f.puestosSim, colW - 12, "normal", 7.8) }));
      const altLey = [];
      for (let i = 0; i < leyenda.length; i += 2) altLey.push(Math.max(leyenda[i].ls.length, leyenda[i + 1] ? leyenda[i + 1].ls.length : 0) * 10 + 4);
      const total = 20 + d + 16 + altLey.reduce((s, h) => s + h, 0);
      asegurar(total);
      doc.texto((R.tipo === "simulado" ? "Composición simulada" : "Composición") + " · un punto por escaño, en el orden en que se adjudica", M, y + 9, { tam: 8, fuente: "negrita", color: TONOS.tinta2 });
      y += 18;
      adj.forEach((a, i) => {
        const cx = M + d / 2 + i * (d + gap);
        punto(cx, y + d / 2, d / 2, a.color);
        if (S <= 30) doc.texto(ordinal(a.numero), cx, y + d + 9, { tam: 6.2, color: TONOS.gris, alinear: "centro" });
      });
      y += d + 18;
      let k = 0;
      for (let i = 0; i < leyenda.length; i += 2) {
        [leyenda[i], leyenda[i + 1]].forEach((it, j) => {
          if (!it) return;
          const x = M + j * (colW + 16);
          punto(x + 3.2, y + 4.6, 3.2, it.f.color);
          doc.parrafo(it.ls, x + 11, y + 7.6, colW - 12, { tam: 7.8, color: TONOS.tinta, interlineado: 10 });
        });
        y += altLey[k++];
      }
      y += 6;
    })();

    /* ===================== 2 · COCIENTES ELECTORALES ==================== */
    seccion("Cocientes electorales", "Votos de cada " + T.sing + " divididos entre la serie " + R.metodo.serie + (R.tipo === "simulado" ? ", con los cambios del «¿qué pasa si…?»" : "") + ", como en la tabla del simulador. Porcentajes sobre " + fmtEntero(R.coc.baseValidos) + " votos válidos.", 170);
    (function cocientes() {
      const C = R.coc;
      const tam = C.divisores.length > 7 ? 7.6 : 8.2;
      let anchoQ = 0;
      C.filas.forEach((f) => f.cocientes.forEach((q) => {
        anchoQ = Math.max(anchoQ, doc.ancho(q.texto, q.numero ? "negrita" : "normal", tam) + (q.numero ? doc.ancho(String(q.numero), "negrita", tam * 0.68) + 1.4 : 0));
      }));
      const wQ = Math.max(36, anchoQ + 13), wP = 50, wV = 56, wE = 44, minN = 118;
      const caben = Math.max(1, Math.floor((CW - minN - wP - wV - wE) / wQ));
      for (let a = 0, p = 0; a < C.divisores.length; a += caben, p++) {
        const b = Math.min(C.divisores.length, a + caben);
        const fijas = p === 0;
        const wN = CW - (b - a) * wQ - (fijas ? wP + wV + wE : 0);
        if (!fijas) subtitulo("Cocientes electorales (divisores " + C.divisores[a] + " a " + C.divisores[b - 1] + ")", 70);
        const cols = [{ t: T.Sing, w: wN }].concat(fijas ? [{ t: "% de voto", w: wP, al: "der" }, { t: "Votos", w: wV, al: "der" }, { t: "Escaños", w: wE, al: "der" }] : []).concat(C.divisores.slice(a, b).map((d) => ({ t: "÷ " + d, w: wQ, al: "der" })));
        const filas = C.filas.map((f) => ({
          c: [{ t: f.nombre + (f.elegible ? "" : f.motivo === "umbral" ? " (bajo el umbral)" : " (sin votos)"), punto: f.color, fuente: "negrita", color: f.elegible ? TONOS.tinta : TONOS.gris }]
            .concat(fijas ? [fmtPct(f.pct, 2), fmtEntero(f.votos), { t: fmtEntero(f.escanos), fuente: "negrita" }] : [])
            .concat(f.cocientes.slice(a, b).map((q) => q.numero ? { t: q.texto, fuente: "negrita", fondo: f.color.suave || mezclar(f.color.hex, 0.86), sup: q.numero, colorSup: f.color.hex } : q.fuera ? { t: q.texto, marco: "#7d879b", color: TONOS.tinta2 } : { t: q.texto, color: TONOS.gris }))
        }));
        if (fijas) filas.push({ total: true, c: ["Total", fmtPct(C.sumaPct, 2), fmtEntero(C.sumaListas), fmtEntero(R.S)].concat(C.divisores.slice(a, b).map(() => "")) });
        tabla(cols, filas, { tam, continua: "Cocientes electorales" });
      }
      const sp = C.sumaPct;
      nota(Math.abs(sp - 100) < 0.05 ? "Los porcentajes suman 100 %: todos los votos válidos están repartidos." : sp > 100 ? "Los porcentajes suman " + fmtPct(sp, 2) + ": se pasan " + fmtPct(sp - 100, 2) + " del 100 %." : "Los porcentajes suman " + fmtPct(sp, 2) + ": queda " + fmtPct(100 - sp, 2) + " sin repartir (" + fmtEntero(Math.max(0, C.baseValidos - C.sumaListas)) + " votos).", { fuente: "normal", color: TONOS.tinta2, despues: 6 });
      // Leyenda, como la del simulador
      asegurar(16);
      const c0 = (C.filas.find((f) => f.cocientes.some((q) => q.numero)) || {}).color || { hex: TONOS.acento };
